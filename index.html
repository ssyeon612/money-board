<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>내 자산 현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow reading column; summary first, then bar lists and plain ledgers. Ink-only marks, color reserved for 손익. */
:root {
  --bg: #f5f6f7;
  --surface: #ffffff;
  --ink: #14171a;
  --muted: #646b74;
  --line: #e2e5e9;
  --track: #e9ecef;
  --mark: #1d2227;
  --mark-2: #a3aab2;
  --up: #c92a2a;
  --down: #1c5fd0;
  --font: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --surface: #181b1e; --ink: #eceef0; --muted: #9aa1a9; --line: #2a2e33;
    --track: #262a2f; --mark: #e1e4e8; --mark-2: #6b727a; --up: #ff7b7b; --down: #7db0ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101214; --surface: #181b1e; --ink: #eceef0; --muted: #9aa1a9; --line: #2a2e33;
  --track: #262a2f; --mark: #e1e4e8; --mark-2: #6b727a; --up: #ff7b7b; --down: #7db0ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  font-variant-numeric: tabular-nums;
  padding-inline: 16px; padding-block: 28px 56px;
}
.wrap { max-width: 920px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.asof { color: var(--muted); font-size: 13px; }

section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; margin: 0 0 16px; }
h2 svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 20px 0 8px; }
.note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }

/* Summary */
.label { color: var(--muted); font-size: 13px; }
.hero { font-size: clamp(30px, 8vw, 44px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.unit { font-size: 0.5em; font-weight: 500; margin-left: 2px; color: var(--muted); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.stat b { display: block; font-size: 19px; font-weight: 600; }

/* Two-part split bar */
.split { display: flex; gap: 2px; height: 10px; margin-top: 18px; }
.split i { display: block; height: 100%; border-radius: 3px; background: var(--mark); min-width: 4px; }
.split i + i { background: var(--mark-2); }
.legend { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; }
.legend div { min-width: 0; }
.legend div + div { text-align: right; }
.legend .k { color: var(--muted); display: flex; align-items: center; gap: 6px; }
.legend div + div .k { justify-content: flex-end; }
.legend .k::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--mark); flex: none; }
.legend div + div .k::before { background: var(--mark-2); }
.legend b { font-weight: 600; font-size: 15px; }
.legend span.p { color: var(--muted); margin-left: 6px; }

/* Bar list */
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar-row .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.bar-row .name { font-weight: 500; }
.bar-row .val { white-space: nowrap; }
.bar-row .val .p { color: var(--muted); display: inline-block; min-width: 3.6em; text-align: right; }
.bar { height: 6px; background: var(--track); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--mark); border-radius: 3px; }

/* Ledger rows */
.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 0; }
.row .l { min-width: 0; }
.row .r { text-align: right; white-space: nowrap; flex: none; }
.row .t { font-weight: 500; }
.row .s { color: var(--muted); font-size: 13px; }
.row.total { border-top: 1px solid var(--ink); font-weight: 600; }
.row.total .t { font-weight: 600; }
.tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; font-weight: 400; }

.up { color: var(--up); }
.down { color: var(--down); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 20px; }
@media (max-width: 720px) { .kpis { grid-template-columns: 1fr 1fr; } }
.kpis b { display: block; font-size: 17px; font-weight: 600; }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 480px; }
th, td { padding: 9px 0 9px 16px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
thead th { border-top: 0; padding-top: 0; color: var(--muted); font-size: 13px; font-weight: 500; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>내 자산 현황</h1>
    <span class="asof" id="asof"></span>
  </header>

  <section id="summary"></section>

  <div class="cols">
    <section>
      <h2><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>자산 구성</h2>
      <div class="bars" id="composition"></div>
    </section>
    <section>
      <h2><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/></svg>유동성</h2>
      <div id="liquidity"></div>
      <p class="note">유동자산은 투자자산과 비상금, 비유동자산은 전세보증금·청약·청년도약계좌입니다.</p>
    </section>
  </div>

  <section>
    <h2><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>항목별 자산</h2>
    <div class="rows" id="items"></div>
    <h3>부채</h3>
    <div class="rows" id="debts"></div>
  </section>

  <section>
    <h2><svg viewBox="0 0 24 24"><path d="M4 5v14h16M8 15l3-4 3 2 5-6"/></svg>투자 종목</h2>
    <div class="kpis" id="invest-kpis"></div>
    <div id="invest-split"></div>
    <h3>보유 종목 (평가금액 순)</h3>
    <div class="rows" id="holdings"></div>
    <p class="note" id="fx"></p>
  </section>

  <section>
    <h2><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>월별 자산 추이</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>기준월</th><th>총자산</th><th>전월 대비</th><th>부채</th><th>순자산</th></tr></thead>
        <tbody id="monthly"></tbody>
      </table>
    </div>
    <p class="note">시트에 월별 값이 입력된 달만 표시합니다.</p>
  </section>
</div>

<script>
// 구글 시트 스냅샷 (자산 대시보드 / 자산현황 / 투자 종목 / 월별 자산 추이)
const DATA = {
  asOf: "2026-10-03",
  total: 70614200, net: 30614200, debt: 40000000,
  composition: [
    ["주거자산", 21720000], ["청약", 16140000], ["저축", 11200000], ["투자자산", 20353451], ["비상금", 1200749]
  ],
  liquidity: { liquid: 21554200, illiquid: 49060000 },
  items: [
    ["주거자산", "전세보증금", "우리은행", 21720000, false],
    ["청약", "청년 주택드림 청약통장", "신한은행", 16140000, false],
    ["저축", "청년도약계좌", "IBK", 11200000, false],
    ["비상금", "비상금", "케이뱅크", 700749, true],
    ["비상금", "경조사비", "케이뱅크", 400000, true],
    ["비상금", "내 선물", "케이뱅크", 100000, true],
    ["투자자산", "CMA", "NH투자증권", 9985451, true],
    ["투자자산", "금현물", "NH투자증권", 1096000, true],
    ["투자자산", "ISA", "한국투자증권", 7083000, true],
    ["투자자산", "CMA", "한국투자증권", 2189000, true]
  ],
  debts: [["전세대출", "버팀목 전세자금", "우리은행", 40000000]],
  invest: {
    cost: 18810871, value: 16902488, pl: -1908383, ret: -10.15,
    domestic: 6780125, overseas: 10122363, usdkrw: 1343.975,
    // [티커, 종목명, 통화, 수량, 매입단가, 현재가, 수익률%, 평가금액(원)]
    holdings: [
      ["446720", "SOL 미국배당다우존스", "KRW", 141, 12127, 12875, 6.17, 1815375],
      ["360200", "ACE 미국 S&P500", "KRW", 60, 26110, 26055, -0.21, 1563300],
      ["367380", "ACE 미국나스닥100", "KRW", 41, 31471, 31500, 0.09, 1291500],
      ["161510", "PLUS 고배당주", "KRW", 11, 25115, 24490, -2.49, 269390],
      ["0181L0", "SOL 미국우주항공TOP10", "KRW", 201, 12148, 6960, -42.71, 1398960],
      ["0183J0", "TIGER 미국우주테크", "KRW", 60, 15234, 7360, -51.69, 441600],
      ["GOOGL", "구글", "USD", 12, 363.66, 343.50, -5.54, 5539865],
      ["SPCX", "스페이스X", "USD", 12, 185.35, 158.96, -14.24, 2563659],
      ["SCHD", "SCHD", "USD", 23, 28.22, 32.72, 15.95, 1011422],
      ["QQQ", "QQQ", "USD", 1, 658.80, 749.58, 13.78, 1007417]
    ]
  },
  monthly: [["2026-09", 77400000, null, 40000000, 37400000]]
};

const $ = id => document.getElementById(id);
const n = v => Math.round(v).toLocaleString("ko-KR");
const won = v => n(v) + "원";
const pct = (v, d = 1) => v.toFixed(d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 국내 관례: 상승 빨강 ▲, 하락 파랑 ▼
const delta = (v, text) => v === 0 ? text : `<span class="${v > 0 ? "up" : "down"}">${v > 0 ? "▲" : "▼"} ${text}</span>`;
const price = (v, cur) => cur === "USD" ? "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : n(v) + "원";

function split(aName, a, bName, b) {
  const t = a + b;
  return `<div class="split" role="img" aria-label="${aName} ${pct(a / t * 100)}, ${bName} ${pct(b / t * 100)}">
      <i style="flex:${a}"></i><i style="flex:${b}"></i></div>
    <div class="legend">
      <div><span class="k">${aName}</span><b>${won(a)}</b><span class="p">${pct(a / t * 100)}</span></div>
      <div><span class="k">${bName}</span><b>${won(b)}</b><span class="p">${pct(b / t * 100)}</span></div>
    </div>`;
}

const D = DATA;
$("asof").textContent = D.asOf.replace(/-/g, ".") + " 기준";

$("summary").innerHTML = `
  <div class="label">순자산</div>
  <div class="hero">${n(D.net)}<span class="unit">원</span></div>
  ${split("순자산", D.net, "부채", D.debt)}
  <div class="stats">
    <div class="stat"><span class="label">총자산</span><b>${won(D.total)}</b></div>
    <div class="stat"><span class="label">부채 (총자산 대비 ${pct(D.debt / D.total * 100)})</span><b>${won(D.debt)}</b></div>
  </div>`;

const maxComp = Math.max(...D.composition.map(c => c[1]));
$("composition").innerHTML = [...D.composition].sort((a, b) => b[1] - a[1]).map(([name, v]) => `
  <div class="bar-row">
    <div class="top"><span class="name">${name}</span><span class="val">${won(v)} <span class="p">${pct(v / D.total * 100)}</span></span></div>
    <div class="bar"><i style="width:${v / maxComp * 100}%"></i></div>
  </div>`).join("");

$("liquidity").innerHTML = split("유동자산", D.liquidity.liquid, "비유동자산", D.liquidity.illiquid);

$("items").innerHTML = D.items.map(([cat, name, bank, v, liquid]) => `
  <div class="row">
    <div class="l"><div class="t">${esc(name)}<span class="tag">${liquid ? "유동" : "비유동"}</span></div><div class="s">${cat} · ${bank}</div></div>
    <div class="r"><div class="t">${won(v)}</div><div class="s">${pct(v / D.total * 100)}</div></div>
  </div>`).join("") + `
  <div class="row total"><div class="l t">총 자산</div><div class="r">${won(D.total)}</div></div>`;

$("debts").innerHTML = D.debts.map(([cat, name, bank, v]) => `
  <div class="row">
    <div class="l"><div class="t">${esc(name)}</div><div class="s">${cat} · ${bank}</div></div>
    <div class="r"><div class="t">${won(v)}</div><div class="s">총자산 대비 ${pct(v / D.total * 100)}</div></div>
  </div>`).join("") + `
  <div class="row total"><div class="l t">순자산</div><div class="r">${won(D.net)}</div></div>`;

const I = D.invest;
$("invest-kpis").innerHTML = `
  <div><span class="label">총 평가금액</span><b>${won(I.value)}</b></div>
  <div><span class="label">총 매수금액</span><b>${won(I.cost)}</b></div>
  <div><span class="label">평가손익</span><b>${delta(I.pl, won(Math.abs(I.pl)))}</b></div>
  <div><span class="label">수익률</span><b>${delta(I.ret, pct(Math.abs(I.ret), 2))}</b></div>`;
$("invest-split").innerHTML = split("국내", I.domestic, "해외", I.overseas);

$("holdings").innerHTML = [...I.holdings].sort((a, b) => b[7] - a[7]).map(([code, name, cur, qty, buy, now, ret, krw]) => `
  <div class="row">
    <div class="l"><div class="t">${esc(name)}</div>
      <div class="s">${code} · ${n(qty)}주 · ${price(buy, cur)} → ${price(now, cur)}</div></div>
    <div class="r"><div class="t">${won(krw)}</div>
      <div class="s">${delta(ret, pct(Math.abs(ret), 2))} · 비중 ${pct(krw / I.value * 100)}</div></div>
  </div>`).join("");
$("fx").textContent = `해외 종목은 USD/KRW ${I.usdkrw.toLocaleString("ko-KR")} 기준으로 환산했습니다.`;

$("monthly").innerHTML = D.monthly.map(([m, total, diff, debt, net]) => `
  <tr><td>${m}</td><td>${won(total)}</td><td>${diff == null ? "-" : delta(diff, won(Math.abs(diff)))}</td><td>${won(debt)}</td><td>${won(net)}</td></tr>`).join("");
</script>
</body>
</html>
